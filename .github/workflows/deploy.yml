name: Deploy

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Hostname
        type: string
        required: true
        default: antville.org

jobs:
  stage:
    runs-on: antville

    environment:
      name: production
      url: ${{ inputs.hostname }}

    steps:
      - uses: actions/checkout@v6

      - name: Compute variables
        run: |
          date=$(git show -s --format=%ch $GITHUB_SHA)
          message="Deployment $GITHUB_RUN_ID of $GITHUB_REPOSITORY at $GITHUB_SHA ($date)"
          echo "message=$message" >> $GITHUB_ENV

      - name: Save local changes
        run: ssh ${{ inputs.hostname }} save "$message"

      - name: Build with Gradle
        run: ./gradlew :build

      - name: Copy files to server
        run: |
          rsync ./build/install/antville/ ${{ inputs.hostname }}:./apps/antville/ \
            --archive --compress --delete --verbose \
            --filter '+ /claustra' \
            --filter '+ /code' \
            --filter '+ /compat' \
            --filter '+ /db' \
            --filter '+ /i18n' \
            --filter '+ /lib' \
            --filter '- /*'
          rsync ./build/install/antville/static/ ${{ inputs.hostname }}:./apps/antville/static/ \
            --archive --compress --verbose \
            --filter '+ /fonts' \
            --filter '+ /formica.html' \
            --filter '+ /img' \
            --filter '+ /scripts' \
            --filter '+ /styles' \
            --filter '- /*'

      - name: Commit deployed changes
        run: ssh ${{ inputs.hostname }} commit "$message"

      - name: Restart Helma
        run: ssh ${{ inputs.hostname }} restart
